<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情境感知交互助手</title><link rel="stylesheet" href="/style.css"></head><body>
<main><header><span>电脑原型 · 文书核对</span><h1>读懂通知，核对材料</h1><p>本地识别文字；确认后才发送文字到 DeepSeek。材料是否备齐由你确认。</p></header>
<section class="grid"><div class="panel"><h2>1 · 识别通知</h2><video id="video" autoplay playsinline muted hidden></video><canvas id="canvas" hidden></canvas><div class="row"><button id="camera">开启后置摄像头</button><button id="capture" disabled>拍照识别</button><label class="upload">选择照片<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label></div><textarea id="source" rows="9" placeholder="识别文字显示在这里。也可粘贴或修正通知文字。"></textarea><p id="hint" class="hint">等待扫描</p></div>
<div class="panel"><h2>2 · 当前任务</h2><div id="status" role="status">待扫描</div><div id="proposal" hidden><p>检测到材料要求。是否整理材料清单？</p><button id="confirm">确认并调用 DeepSeek</button><button id="dismiss">忽略</button></div><div id="results" hidden><p id="progress"></p><ul id="items"></ul><button id="save">保存本次结果</button></div><div class="row"><button id="retry" hidden>重试</button><button id="cancel">取消／重新开始</button></div><p class="hint">滚轮或上下滑动切换材料；双击切换确认。也可直接点选。</p></div></section>
<footer>演示范围：材料提取和人工核对。完成表示“材料已由用户核对”，不表示申请已办理。</footer></main><script type="module" src="/app.js"></script></body></html>
